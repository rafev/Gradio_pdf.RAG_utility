[project]
name = "paper-rag"
version = "0.1.0"
description = "Agentic RAG over a corpus of scientific papers, with a 3D knowledge graph UI."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "anthropic>=0.70",
    "chromadb>=1.0",
    "sentence-transformers>=3.0",
    "torch>=2.5",
    "pymupdf>=1.24",
    "networkx>=3.3",
    "rapidfuzz>=3.9",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "httpx>=0.27", "ruff>=0.6"]

[project.scripts]
paper-rag-ingest = "paper_rag.ingest.__main__:main"
paper-rag-serve = "paper_rag.api.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/paper_rag"]

[tool.uv]
python-preference = "only-managed"

[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
src = ["src"]
